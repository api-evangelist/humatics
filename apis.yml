aid: humatics
name: Humatics
description: 'Humatics Corporation is a Waltham, Massachusetts microlocation company
  founded in 2015 by MIT professor David Mindell and led by CEO James Kinsey. It builds
  radio-frequency positioning systems — ultra-wideband beacons, RF-pulse ranging, radar
  and inertial sensors fused in software — that locate people, vehicles and robots at
  centimeter- to millimeter-scale precision. Two product lines are on sale today: MILO,
  a sub-millimeter positioning system for industrial automation and in-motion robotics,
  advertised as compatible with Yaskawa, Mitsubishi Electric, FANUC, Universal Robots
  and KUKA; and Mobility, a rail and transit portfolio covering the FOCUS track-geometry
  monitoring kit and the Humatics Rail Navigation System (HRNS), used on New York City
  MTA subway signalling projects. Humatics publishes no developer portal, no API documentation
  and no machine-readable description of any product API. Two rounds of probing humatics.com
  returned HTTP 404 for every /.well-known/ path, /llms.txt, /openapi.json, /openapi.yaml,
  /swagger.json, /api-docs and /graphql; *.humatics.com is a DNS wildcard onto one retired
  address, so api., docs., developer., portal. and status. resolve but time out on connect.
  The only machine-readable HTTP interface on any Humatics host is the WordPress REST API of
  the marketing site itself at humatics.com/wp-json/ — 375 routes across 19 stock core and
  commercial-plugin namespaces, exposing pages and posts rather than positioning, and so
  recorded as evidence rather than catalogued as a Humatics API. The GitHub organization
  github.com/Humatics is real and public, but 31 of its 33 repositories are forks of
  third-party embedded and robotics open source (Fast-RTPS, Fast-CDR, FreeRTOS, Orange Pi
  BSP, Yocto meta-layers, EIPScanner, donkeycar); the two non-forks are internal tools. There
  is no first-party SDK, client library or specification, and no package named humatics exists
  on npm or PyPI. Marketing material for the earlier KinetIQ OS / Spatial Intelligence Platform
  referenced an "extensible API", but no public interface for it was ever documented, and the
  news host that carried those announcements (now.humatics.com) no longer answers.'
