dns:
  wildcard: true
  wildcard_note: >-
    *.humatics.com resolves to a single A record, 3.224.140.94 — the retired HubSpot host that
    used to serve now.humatics.com. Any invented subdomain therefore answers DNS. Resolution is
    NOT evidence a host exists; every one of these times out on TCP connect on both 80 and 443.
