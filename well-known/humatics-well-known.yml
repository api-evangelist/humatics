contract_discovery:
  openapi: none
  swagger: none
  graphql: none
  asyncapi: none
  grpc: none
  mcp: none
  agent_card: none
  wordpress_rest: present
  wordpress_rest_note: >-
    https://humatics.com/wp-json/ returns HTTP 200 application/json, 330,601 bytes: a complete
    WordPress REST API discovery document advertising 19 namespaces (wp/v2, wp-block-editor/v1,
    wp-site-health/v1, wp-abilities/v1, oembed/1.0, batch/v1, plus plugin namespaces for
    Elementor, Elementor Pro, Elementor AI, UAEL, FluentForm, HubSpot leadin, Redirection,
    Google Site Kit, Really Simple Security, bsf-core and nps-survey) across 375 routes, 114 of
    them under /wp/v2. Authentication is advertised as WordPress application passwords. This is
    stock WordPress core plus commercial plugins — the CMS behind an eight-page marketing site.
    It carries no Humatics positioning, ranging, MILO, FOCUS or HRNS capability, so it is NOT
    registered as an API in apis.yml and no OpenAPI is derived from it. It is recorded as
    evidence, excerpted to well-known/humatics-wp-json-index.json, because it is the single
    machine-readable HTTP interface Humatics operates and a later round should not mistake it
    for a product contract.
  probed_spec_paths:
  - {url: 'https://humatics.com/openapi.json', status: 404}
  - {url: 'https://humatics.com/openapi.yaml', status: 404}
  - {url: 'https://humatics.com/swagger.json', status: 404}
  - {url: 'https://humatics.com/api-docs', status: 404}
  - {url: 'https://humatics.com/docs', status: 404}
  - {url: 'https://humatics.com/graphql', status: 404}
  - {url: 'https://humatics.com/wp-json/', status: 200, result: wordpress-cms-rest-api}
