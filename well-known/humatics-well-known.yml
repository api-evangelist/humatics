notes: >-
  Recorded so a later round does not re-probe blind. humatics.com is a WordPress site on
  Pantheon fronted by Fastly; every /.well-known/ path, /llms.txt and /agents.md answers HTTP
  404 with the site's HTML 404 page — a real 404, not a bot wall and not an SPA catch-all
  returning 200. www.humatics.com behaves identically. No RFC 9116 security.txt, no OIDC/OAuth
  authorization-server metadata, no RFC 9728 protected-resource metadata, no api-catalog, no
  ai-plugin.json, and no A2A agent card at either the canonical /.well-known/agent-card.json or
  the legacy /.well-known/agent.json exists on any Humatics host. No apis.yml pointer is wired
  from this file, because nothing scoreable was found — this is a probe record, not a discovery
  surface, and wiring a WellKnown or APICatalog pointer at an all-404 result would assert a
  discovery posture Humatics does not have.
